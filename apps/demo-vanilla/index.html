<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>treekit — vanilla demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>treekit / vanilla</h1>
      <p>10,000 nodes, zero dependencies, no framework — @treekit/core driving plain DOM.</p>
      <input id="filter" type="search" placeholder="Filter…" aria-label="Filter tree" />
    </header>
    <main>
      <aside aria-label="Palette">
        <h2>Palette</h2>
        <p class="hint">
          Drag onto the tree — or press Space on a tree row to move it with arrows.
        </p>
        <ul id="palette"></ul>
      </aside>
      <section id="viewport" role="tree" tabindex="0" aria-label="Demo tree">
        <div id="content"></div>
        <div id="insertion-line" hidden></div>
      </section>
    </main>
    <div id="live-region" aria-live="assertive" class="visually-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
