version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'ng-packagr']
      react:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
            '@vitejs/plugin-react',
            'eslint-plugin-react-hooks',
            '@testing-library/*',
          ]
      # Minor and patch only: a major matches no group, so it arrives as its own PR and is
      # merged or closed on its own CI result.
      dev-tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
        exclude-patterns:
          [
            '@angular/*',
            '@angular-devkit/*',
            'ng-packagr',
            'react',
            'react-dom',
            '@types/react*',
            '@vitejs/plugin-react',
            'eslint-plugin-react-hooks',
            '@testing-library/*',
          ]
    # Framework majors change an adapter's peer range — do them by hand, as a deliberate release.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      # @vitejs/plugin-react 6 requires Vite 8, a toolchain migration tracked in BACKLOG.md; do both by hand.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # TypeScript 7 ships no compiler API, which tsup's .d.ts build (rollup-plugin-dts) needs.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node types track the oldest supported Node (engines >= 20.11; CI on 22), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # changesets/action v2 requires Changesets v3; upgrade the CLI and the action together, by hand.
      - dependency-name: '@changesets/cli'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # v2 requires @changesets/cli v3 (see the npm ignore above); move both together, by hand.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
