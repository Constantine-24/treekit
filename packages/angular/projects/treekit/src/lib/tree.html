<div
  #viewport
  class="tk-viewport"
  role="tree"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-activedescendant]="activeDescendant()"
  (keydown)="onKeydown($event)"
>
  <div #content class="tk-content" [style.height.px]="totalSize()">
    @for (row of rows(); track row.node.id) {
      <div
        class="tk-row"
        [style.transform]="'translateY(' + row.start + 'px)'"
        [style.height.px]="row.size"
      >
        <div
          class="tk-node"
          role="treeitem"
          [id]="'tk-node-' + row.node.id"
          [attr.aria-level]="row.node.level + 1"
          [attr.aria-expanded]="row.ariaExpanded"
          [attr.aria-selected]="row.node.id === selectedId()"
          [attr.data-node-id]="row.node.id"
          [class.selected]="row.node.id === selectedId()"
          [class.folder-hovered]="row.node === hoveredFolder()"
          [class.active]="'tk-node-' + row.node.id === activeDescendant()"
          [class.draggable]="row.canDrag"
          [style.padding-left.px]="row.node.level * indentWidth()"
          [draggable]="row.canDrag"
          (click)="onRowClick(row.node)"
          (dblclick)="nodeDblClick.emit(row.node)"
          (contextmenu)="onContextMenu($event, row.node)"
        >
          @if (row.expandable) {
            @if (row.node.isLoading) {
              <span class="tk-spinner"></span>
            } @else {
              <button
                type="button"
                class="tk-toggle"
                tabindex="-1"
                aria-hidden="true"
                [class.expanded]="row.expanded"
                (click)="onToggle(row.node, $event)"
              >
                <svg viewBox="0 0 16 16" width="14" height="14" focusable="false">
                  <path
                    d="M6 4l4 4-4 4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            }
          } @else {
            <span class="tk-toggle-spacer"></span>
          }
          @if (nodeDef(); as def) {
            <ng-container
              *ngTemplateOutlet="
                def.template;
                context: { $implicit: row.node, node: row.node, index: row.index }
              "
            />
          } @else {
            <span class="tk-name">{{ row.node.name }}</span>
          }
        </div>
      </div>
    }
    @if (insertionLine(); as line) {
      <div class="tk-insertion-line" [style.top.px]="line.top" [style.left.px]="line.left"></div>
    }
  </div>
</div>
<div class="tk-live-region" aria-live="assertive" aria-atomic="true">
  {{ announcement() }}
</div>
